config-version: 8
server:
  host: "127.0.0.1"
  port: 8317
  # Seconds open requests get to finish when a reload or stop retires a process.
  shutdown-timeout: 600
oauth:
  auth-dir: "./auths"
management:
  disable-control-panel: true
routing:
  strategy: "round-robin"
observability:
  logs:
    request-log: false
